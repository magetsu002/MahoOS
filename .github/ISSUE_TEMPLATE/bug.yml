name: Bug report
description: Report a reproducible MahoOS defect
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check docs/COMPONENTS.md so the report names the affected owner when possible. Never post credentials, private keys, recovery secrets, or raw private logs. Redact logs and private machine paths before attaching them.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop / MahoShell
        - MahoSystem / Guardian
        - Update / Recovery / Generations
        - Prevention / Security
        - Installer / Boot
        - Platform integration
        - Packaging / Development
        - Documentation
        - Unsure
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest reproducible sequence.
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Highest evidence level actually reproduced
      options:
        - unit
        - integration
        - VM
        - physical
        - not yet reproduced
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Sanitized context
      description: Relevant source revision, component state, and only the minimum sanitized log lines needed. Do not include credentials, private keys, recovery secrets, raw private logs, or personal/private paths.
