name: maho-files-qml

on:
  push:
    branches:
      - main
    paths:
      - 'apps/maho-files/**'
      - 'bin/maho-files'
      - 'packaging/arch/maho-files-wrapper'
      - 'tests/maho-files*.sh'
      - '.github/workflows/maho-files-qml.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/maho-files/**'
      - 'bin/maho-files'
      - 'packaging/arch/maho-files-wrapper'
      - 'tests/maho-files*.sh'
      - '.github/workflows/maho-files-qml.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest

    steps:
      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            base-devel \
            cmake \
            ninja \
            qt6-base \
            qt6-declarative \
            kio

      - uses: actions/checkout@v4

      - name: Architecture contracts
        run: |
          bash tests/maho-files-qml-contracts.sh
          bash tests/maho-files-dnd-search-contracts.sh
          bash tests/maho-files-ux-closure-contracts.sh

      - name: Configure native app
        run: |
          cmake \
            -S apps/maho-files \
            -B build/maho-files \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMAHO_FILES_BUILD_TESTS=ON

      - name: Compile native app and QML cache
        run: |
          cmake --build build/maho-files --parallel 2

      - name: Focused model operations
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build/maho-files --output-on-failure -R maho-files-model-ops

      - name: Binary proof
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          test -x build/maho-files/maho-files
          build/maho-files/maho-files --version

      - name: QML startup proof
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          timeout 3s build/maho-files/maho-files "$HOME" > qml-smoke.log 2>&1
          status=$?
          set -e

          cat qml-smoke.log

          if [ "$status" -ne 124 ]; then
            echo "Maho Files exited before the smoke timeout (status=$status)" >&2
            exit "$status"
          fi

          if grep -Eq 'QQmlApplicationEngine failed to load component|Cannot override FINAL property' qml-smoke.log; then
            echo "Maho Files QML failed during startup smoke" >&2
            exit 1
          fi
