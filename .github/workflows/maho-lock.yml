name: maho-lock

on:
  push:
    branches:
      - 'feat/maho-lock'
  pull_request:
    paths:
      - 'bin/maho-lock'
      - 'bin/maho-lock-install'
      - 'bin/maho-lock-sddm-install'
      - 'config/quickshell/maho-lock/**'
      - 'config/sddm/maho-lock/**'
      - 'config/hypr/maho/core/binds.lua'
      - 'bin/maho-setup'
      - 'tests/maho-lock-contracts.sh'
      - 'tests/maho-lock-status-targets.sh'
      - 'tests/maho-lock-install-contracts.sh'
      - 'tests/maho-lock-personalization-contracts.sh'
      - 'tests/maho-lock-sddm-contracts.sh'
      - '.github/workflows/maho-lock.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install Arch test dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            diffutils \
            python \
            qt6-base \
            qt6-declarative

      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          set -euo pipefail
          bash -n \
            bin/maho-lock \
            bin/maho-lock-install \
            bin/maho-lock-sddm-install \
            tests/maho-lock-contracts.sh \
            tests/maho-lock-status-targets.sh \
            tests/maho-lock-install-contracts.sh \
            tests/maho-lock-personalization-contracts.sh \
            tests/maho-lock-sddm-contracts.sh
          python3 -m py_compile \
            config/quickshell/maho-lock/state.py \
            config/quickshell/maho-lock/image_browser.py

      - name: Maho Lock contracts
        run: |
          set -euo pipefail
          bash tests/maho-lock-contracts.sh
          bash tests/maho-lock-status-targets.sh
          bash tests/maho-lock-install-contracts.sh
          bash tests/maho-lock-personalization-contracts.sh
          bash tests/maho-lock-sddm-contracts.sh
