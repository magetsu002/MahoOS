name: maho-power

on:
  push:
    branches:
      - main
    paths:
      - 'bin/maho-power'
      - 'config/quickshell/maho-power/**'
      - 'config/quickshell/maho-shell/MahoPowerView.qml'
      - 'config/quickshell/maho-shell/MahoUpdateState.qml'
      - 'config/hypr/maho/core/binds.lua'
      - 'tests/maho-power*.sh'
      - 'tests/shell-contracts.sh'
      - '.github/workflows/maho-power.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'bin/maho-power'
      - 'config/quickshell/maho-power/**'
      - 'config/quickshell/maho-shell/MahoPowerView.qml'
      - 'config/quickshell/maho-shell/MahoUpdateState.qml'
      - 'config/hypr/maho/core/binds.lua'
      - 'tests/maho-power*.sh'
      - 'tests/shell-contracts.sh'
      - '.github/workflows/maho-power.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Power contracts
        run: bash tests/maho-power-contracts.sh

      - name: Power compositor contracts
        run: bash tests/maho-power-compositor-contracts.sh

      - name: Notification keybind contract
        run: |
          set -euo pipefail
          BINDS=config/hypr/maho/core/binds.lua
          [ "$(grep -Fxc -- '-- maho-notify-bind:begin' "$BINDS" || true)" -eq 1 ]
          [ "$(grep -Fxc -- '-- maho-notify-bind:end' "$BINDS" || true)" -eq 1 ]
          grep -Fq 'mainMod .. " + SHIFT + N"' "$BINDS"
          grep -Fq '"$HOME/.local/bin/maho-notify" toggle-center' "$BINDS"
          ! grep -Fq 'mainMod .. " + N"' "$BINDS"
          [ "$(grep -Fc 'mainMod .. " + SHIFT + N"' "$BINDS")" -eq 1 ]

      - name: Existing Maho Shell contracts
        run: bash tests/shell-contracts.sh

      - name: Runtime syntax
        run: bash -n bin/maho-power
