name: maho-power

on:
  push:
    branches:
      - 'feat/maho-power-session'
      - 'feat/maho-power-session-*'
      - 'fix/maho-power-*'
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Power contracts
        run: bash tests/maho-power-contracts.sh

      - name: Power compositor contracts
        run: bash tests/maho-power-compositor-contracts.sh

      - name: Notification keybind contract
        run: |
          set -euo pipefail
          BINDS=config/hypr/maho/core/binds.lua
          [ "$(grep -Fxc -- '-- maho-notify-bind:begin' "$BINDS" || true)" -eq 1 ]
          [ "$(grep -Fxc -- '-- maho-notify-bind:end' "$BINDS" || true)" -eq 1 ]
          grep -Fq 'mainMod .. " + SHIFT + N"' "$BINDS"
          grep -Fq '"$HOME/.local/bin/maho-notify" center' "$BINDS"
          ! grep -Fq 'mainMod .. " + N"' "$BINDS"
          [ "$(grep -Fc 'mainMod .. " + SHIFT + N"' "$BINDS")" -eq 1 ]

      - name: Existing Maho Shell contracts
        run: bash tests/shell-contracts.sh

      - name: Runtime syntax
        run: bash -n bin/maho-power
