name: core-contracts

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Branch diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD

      - name: Install native contract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-cryptography libbpf-dev llvm

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            bin/mahoctl \
            bin/maho-theme \
            bin/maho-wallpaper \
            bin/maho-wallpaper-session \
            bin/maho-observe \
            bin/maho-adapt \
            bin/maho-provenance \
            bin/maho-security \
            bin/maho-security-monitor \
            bin/maho-guard \
            bin/maho-guardian-watch \
            bin/maho-contain \
            bin/maho-shell \
            bin/maho-notify \
            bin/maho-session \
            bin/maho-setup \
            lib/authority.sh \
            lib/state.sh \
            lib/events.sh \
            lib/intent.sh \
            lib/decision.sh \
            lib/policy.sh \
            lib/cycle.sh \
            lib/transaction.sh \
            adapters/appearance/wallpaper-theme.sh \
            tests/fixtures/fake-adapter.sh \
            theme/backends/basic/generate \
            theme/backends/matugen/generate \
            tests/core-contracts.sh \
            tests/policy-contracts.sh \
            tests/cycle-contracts.sh \
            tests/transaction-contracts.sh \
            tests/adapt-executor.sh \
            tests/wallpaper-policy.sh \
            tests/wallpaper-restore.sh \
            tests/provenance-contracts.sh \
            tests/security-findings.sh \
            tests/security-probes.sh \
            tests/security-containment.sh \
            tests/security-monitor.sh \
            tests/security-incidents.sh \
            tests/security-preflight.sh \
            tests/security-boundaries.sh \
            tests/setup-contracts.sh \
            tests/environment-observers.sh \
            tests/notify-contracts.sh \
            tests/glass-contracts.sh \
            tests/session-contracts.sh \
            tests/shell-contracts.sh \
            tests/qemu-secure-boot-certification.sh \
            tools/vm/installer-storage-integration.sh \
            packaging/arch/maho-installer-wrapper

      - name: Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            lib/security_probe.py \
            lib/security_containment.py \
            lib/security_incident.py \
            lib/security_preflight.py \
            lib/security_boundary.py \
            lib/guardian_evidence.py \
            lib/guardian_intent.py \
            lib/guardian_world_state.py \
            lib/guardian_provider_state.py \
            lib/guardian_journal_stream.py \
            lib/guardian_service_watcher.py \
            lib/guardian_live_state.py \
            lib/guardian_live_cli.py \
            lib/guardian_signed_boot_provider.py \
            lib/guardian_causality.py \
            lib/guardian_causal_projection.py \
            lib/guardian_causal_status.py \
            lib/guardian_containment.py \
            lib/guardian_containment_adapter.py \
            lib/guardian_security_recovery.py \
            lib/guardian_reliability.py \
            lib/guardian_reliability_provider.py \
            lib/guardian_watch_main.py \
            lib/guardian_completion_status.py \
            lib/maho_boot_authority.py \
            lib/maho_boot_publication.py \
            lib/maho_kernel_security.py \
            lib/maho_release_manifest.py \
            lib/maho_secure_boot.py \
            tools/build-qemu-secure-boot-fixtures.py \
            tools/qemu-secure-boot-certify.py \
            tools/qemu_secure_boot_common.py \
            tests/test_guardian_causality.py \
            tests/test_guardian_causal_projection.py \
            tests/test_guardian_causal_status.py \
            tests/test_guardian_containment.py \
            tests/test_guardian_security_recovery.py \
            tests/test_guardian_reliability.py \
            tests/test_guardian_completion_status.py \
            lib/maho_installer_plan.py \
            lib/maho_installer_execute.py \
            tests/test_maho_installer_plan.py \
            tests/test_maho_installer_execute.py \
            bin/maho-installer \
            config/quickshell/maho-shell/state.py \
            config/quickshell/maho-notify/state.py

      - name: JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool config/ownership.json >/dev/null
          python -m json.tool config/intent.json >/dev/null
          python -m json.tool config/adapters.json >/dev/null

      - name: Core contract tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/core-contracts.sh

      - name: Pure policy tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/policy-contracts.sh

      - name: Adaptation cycle tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/cycle-contracts.sh

      - name: Transaction adapter tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/transaction-contracts.sh

      - name: Generic adaptation executor tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/adapt-executor.sh

      - name: Wallpaper policy tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/wallpaper-policy.sh

      - name: Wallpaper restore tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/wallpaper-restore.sh

      - name: Security provenance tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/provenance-contracts.sh

      - name: Security finding tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/security-findings.sh

      - name: Security integrity and persistence tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/security-probes.sh

      - name: Security containment tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/security-containment.sh

      - name: Security monitor tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/security-monitor.sh

      - name: Security incident correlation tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/security-incidents.sh

      - name: Security prevention preflight tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/security-preflight.sh

      - name: Security boundary observation tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/security-boundaries.sh

      - name: Environment observer tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/environment-observers.sh

      - name: Maho Notify behavior contracts
        shell: bash
        run: |
          set -euo pipefail
          bash tests/notify-contracts.sh

      - name: Maho Notify glass contracts
        shell: bash
        run: |
          set -euo pipefail
          bash tests/glass-contracts.sh

      - name: Maho graphical session contracts
        shell: bash
        run: |
          set -euo pipefail
          bash tests/session-contracts.sh

      - name: Maho Shell UI contracts
        shell: bash
        run: |
          set -euo pipefail
          bash tests/shell-contracts.sh

      - name: Blank-disk installer planning contracts
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_maho_installer_plan.py
          python tests/test_maho_installer_execute.py

  setup-lifecycle:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install Arch setup dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            base-devel \
            cmake \
            imagemagick \
            ninja \
            python \
            qt6-base \
            qt6-declarative \
            qt6-5compat \
            kio
          useradd -m maho-ci

      - uses: actions/checkout@v4

      - name: V1 setup lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          runuser -u maho-ci -- env HOME=/home/maho-ci bash tests/setup-contracts.sh
