name: setup-live-migration

on:
  push:
    branches:
      - main
    paths:
      - 'bin/maho-setup'
      - 'lib/maho_runtime_*.py'
      - 'lib/guardian_runtime_recovery*.py'
      - 'systemd/user/**'
      - 'config/hypr/**'
      - 'config/quickshell/**'
      - 'apps/maho-files/**'
      - 'tests/setup-*.sh'
      - 'tests/setup-contracts.sh'
      - '.github/workflows/setup-live-migration.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'bin/maho-setup'
      - 'lib/maho_runtime_*.py'
      - 'lib/guardian_runtime_recovery*.py'
      - 'systemd/user/**'
      - 'config/hypr/**'
      - 'config/quickshell/**'
      - 'apps/maho-files/**'
      - 'tests/setup-*.sh'
      - 'tests/setup-contracts.sh'
      - '.github/workflows/setup-live-migration.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migration-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: archlinux:latest
    steps:
      - name: Install Arch setup dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            base-devel \
            cmake \
            imagemagick \
            ninja \
            python \
            qt6-base \
            qt6-declarative \
            qt6-5compat \
            kio
          useradd -m maho-ci

      - uses: actions/checkout@v4

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n bin/maho-setup tests/setup-contracts.sh tests/setup-live-migration-contracts.sh

      - name: Recovered live ownership contracts
        shell: bash
        run: |
          set -euo pipefail
          bash tests/setup-live-migration-contracts.sh

      - name: Durable setup lifecycle
        shell: bash
        run: |
          set -euo pipefail
          runuser -u maho-ci -- env HOME=/home/maho-ci bash tests/setup-contracts.sh
