name: setup-live-migration

on:
  push:
    branches:
      - main
      - integration/v1-cleanup
  pull_request:

permissions:
  contents: read

jobs:
  migration-contracts:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install Arch setup dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            base-devel \
            cmake \
            imagemagick \
            ninja \
            python \
            qt6-base \
            qt6-declarative \
            qt6-5compat \
            kio

      - uses: actions/checkout@v4

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n bin/maho-setup tests/setup-contracts.sh tests/setup-live-migration-contracts.sh

      - name: Recovered live ownership contracts
        shell: bash
        run: |
          set -euo pipefail
          bash tests/setup-live-migration-contracts.sh

      - name: Durable setup lifecycle
        shell: bash
        run: |
          set -euo pipefail
          bash tests/setup-contracts.sh
