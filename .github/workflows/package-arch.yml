name: package-arch

on:
  push:
    branches:
      - main
    paths:
      - 'packaging/**'
      - 'tools/build-arch-package.sh'
      - 'apps/maho-files/**'
      - 'bpf/**'
      - 'src/**'
      - 'config/systemd/**'
      - 'config/polkit-1/**'
      - 'config/tmpfiles.d/**'
      - 'share/maho/release.json'
      - '.github/workflows/package-arch.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'packaging/**'
      - 'tools/build-arch-package.sh'
      - 'apps/maho-files/**'
      - 'bpf/**'
      - 'src/**'
      - 'config/systemd/**'
      - 'config/polkit-1/**'
      - 'config/tmpfiles.d/**'
      - 'share/maho/release.json'
      - '.github/workflows/package-arch.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:base-devel
    steps:
      - name: Bootstrap checkout and native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm --needed \
            git zstd python libarchive cmake ninja clang libbpf \
            qt6-base qt6-declarative kio

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prepare unprivileged package builder
        shell: bash
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build package from exact checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          su builder -s /bin/bash -c "cd '$GITHUB_WORKSPACE' && bash tools/build-arch-package.sh '$GITHUB_WORKSPACE/dist'"

      - name: Inspect package payload and provenance
        shell: bash
        run: |
          set -euo pipefail
          package="$(find dist -maxdepth 1 -type f -name 'maho-os-*.pkg.tar.*' ! -name 'maho-os-debug-*' -print -quit)"
          test -n "$package"
          pacman -Qip "$package"
          bsdtar -tf "$package" | sed 's#^\./##' > /tmp/maho-package-files.txt
          grep -Fxq 'usr/bin/maho-install' /tmp/maho-package-files.txt
          grep -Fxq 'usr/bin/maho-installer' /tmp/maho-package-files.txt
          grep -Fxq 'usr/lib/maho/lib/maho_installer_plan.py' /tmp/maho-package-files.txt
          grep -Fxq 'usr/lib/maho/lib/maho_installer_execute.py' /tmp/maho-package-files.txt
          grep -Fxq 'usr/bin/maho-files' /tmp/maho-package-files.txt
          grep -Fxq 'usr/share/applications/io.maho.Files.desktop' /tmp/maho-package-files.txt
          grep -Fxq 'usr/bin/maho-platform' /tmp/maho-package-files.txt
          grep -Fxq 'usr/bin/maho-recovery' /tmp/maho-package-files.txt
          grep -Fxq 'usr/lib/maho/bin/maho-setup' /tmp/maho-package-files.txt
          grep -Fxq 'usr/lib/maho/bin/maho-firewall' /tmp/maho-package-files.txt
          grep -Fxq 'usr/lib/maho/lib/maho_firewall_transaction.py' /tmp/maho-package-files.txt
          grep -Fxq 'usr/lib/maho/bin/maho-memory-certify' /tmp/maho-package-files.txt
          grep -Fxq 'usr/lib/maho/lib/maho_memory_certify.py' /tmp/maho-package-files.txt
          grep -Fxq 'usr/lib/maho/config/hypr/maho/core/session.lua' /tmp/maho-package-files.txt
          grep -Fxq 'usr/lib/maho/apps/maho-files/io.maho.Files.desktop' /tmp/maho-package-files.txt
          grep -Fxq 'usr/lib/maho/apps/maho-files/prebuilt/maho-files' /tmp/maho-package-files.txt
          grep -Fxq 'usr/lib/maho/share/maho/release.json' /tmp/maho-package-files.txt
          bpf_object="$(mktemp)"
          bsdtar -xOf "$package" usr/lib/maho/prevention/maho_prevention.bpf.o > "$bpf_object"
          if grep -aFq '/tmp/tmp.' "$bpf_object"; then
            echo 'packaged BPF object leaks the transient build source path' >&2
            exit 1
          fi
          grep -aFq '/usr/src/debug/maho-os/' "$bpf_object"
          python - dist/release.json "$(git rev-parse HEAD)" <<'PY'
          import json
          import pathlib
          import sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert data["format_version"] == 1
          assert data["source_revision"] == sys.argv[2]
          assert len(data["source_archive_sha256"]) == 64
          PY

      - name: Install package into clean Arch container
        shell: bash
        run: |
          set -euo pipefail
          package="$(find dist -maxdepth 1 -type f -name 'maho-os-*.pkg.tar.*' ! -name 'maho-os-debug-*' -print -quit)"
          pacman -Udd --noconfirm "$package"
          test -x /usr/bin/maho-install
          test -x /usr/bin/maho-installer
          /usr/bin/maho-installer --help >/dev/null
          test -x /usr/bin/maho-files
          test -r /usr/share/applications/io.maho.Files.desktop
          test -x /usr/bin/maho-platform
          test -x /usr/bin/maho-recovery
          test -r /usr/lib/maho/bin/maho-setup
          test -x /usr/lib/maho/bin/maho-firewall
          test -r /usr/lib/maho/lib/maho_firewall_transaction.py
          test -x /usr/lib/maho/bin/maho-memory-certify
          test -r /usr/lib/maho/lib/maho_memory_certify.py
          test -x /usr/lib/maho/apps/maho-files/prebuilt/maho-files
          test -r /usr/lib/maho/share/maho/release.json
          QT_QPA_PLATFORM=offscreen /usr/lib/maho/apps/maho-files/prebuilt/maho-files --version
          /usr/bin/maho-platform status --json | python -m json.tool >/dev/null
          useradd -m tester
          su tester -s /bin/bash -c 'HOME=/home/tester XDG_CONFIG_HOME=/home/tester/.config XDG_DATA_HOME=/home/tester/.local/share XDG_STATE_HOME=/home/tester/.local/state XDG_CACHE_HOME=/home/tester/.cache /usr/bin/maho-install'

      - name: Verify packaged runtime provenance and read-only source hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -L /home/tester/.local/share/maho/runtime/current
          test -f /home/tester/.local/share/maho/runtime/current/manifest.json
          test -x /home/tester/.local/share/maho/runtime/current/apps/maho-files/prebuilt/maho-files
          python - /home/tester/.local/share/maho/runtime/current/manifest.json /usr/lib/maho/share/maho/release.json <<'PY'
          import json
          import pathlib
          import sys
          runtime = json.loads(pathlib.Path(sys.argv[1]).read_text())
          release = json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert runtime["version"] == 3
          assert runtime["source_revision"] == release["source_revision"]
          assert len(runtime["content_sha256"]) == 64
          PY
          if find /usr/lib/maho -type d -name __pycache__ -print -quit | grep -q .; then
            echo 'packaged source was mutated by preflight' >&2
            exit 1
          fi
          su tester -s /bin/bash -c 'HOME=/home/tester XDG_CONFIG_HOME=/home/tester/.config XDG_DATA_HOME=/home/tester/.local/share XDG_STATE_HOME=/home/tester/.local/state XDG_CACHE_HOME=/home/tester/.cache /home/tester/.local/bin/maho-setup status'
          su tester -s /bin/bash -c 'HOME=/home/tester XDG_CONFIG_HOME=/home/tester/.config XDG_DATA_HOME=/home/tester/.local/share XDG_STATE_HOME=/home/tester/.local/state XDG_CACHE_HOME=/home/tester/.cache /home/tester/.local/bin/maho-files doctor'
          su tester -s /bin/bash -c 'HOME=/home/tester XDG_CONFIG_HOME=/home/tester/.config XDG_DATA_HOME=/home/tester/.local/share XDG_STATE_HOME=/home/tester/.local/state XDG_CACHE_HOME=/home/tester/.cache /usr/bin/maho-platform status --json' | python -m json.tool >/dev/null
          su tester -s /bin/bash -c 'HOME=/home/tester XDG_CONFIG_HOME=/home/tester/.config XDG_DATA_HOME=/home/tester/.local/share XDG_STATE_HOME=/home/tester/.local/state XDG_CACHE_HOME=/home/tester/.cache /usr/bin/maho-recovery inspect' >/tmp/maho-recovery-inspect.txt
          grep -Fq 'Current runtime' /tmp/maho-recovery-inspect.txt

      - name: Upload package candidate
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: maho-os-arch-package
          path: |
            dist/maho-os-*.pkg.tar.*
            dist/release.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
