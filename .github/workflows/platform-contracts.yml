name: platform-contracts

on:
  push:
    branches:
      - main
      - integration/v1-cleanup
      - 'integration/**'
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate platform policy schema surface
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool config/platform.json >/dev/null
          python - <<'PY'
          import json
          import pathlib

          p = json.loads(pathlib.Path('config/platform.json').read_text())
          assert p['schema_version'] == 1
          assert p['kernel']['primary_package'] == 'linux-cachyos'
          assert p['kernel']['fallback_package'] == 'linux-cachyos-lts'
          assert p['kernel']['fallback_visibility'] == 'recovery-or-advanced-only'
          assert p['kernel']['custom_kernel_fork'] is False
          assert p['boot']['manager'] == 'limine'
          assert p['boot']['default_kernel'] == 'linux-cachyos'
          assert p['boot']['recovery_kernel'] == 'linux-cachyos-lts'
          assert p['boot']['trusted_config_writer'] == 'maho-signed-boot-publication'
          assert p['boot']['snapshot_integration'] == 'recovery-input-only'
          assert p['boot']['kernel_update_snapshot_restore_certified'] is True
          assert p['boot']['boot_state_transaction_required'] is True
          assert p['update']['native_execution_certified'] is False
          assert p['update']['normal_execution_certified'] is False
          assert p['update']['candidate_root_strategy'] == 'btrfs-subvolume-swap'
          assert p['update']['boot_artifact_transaction_required'] is True
          assert p['update']['automatic_reboot'] is False
          assert p['update']['pacman_config'] == '/etc/maho/pacman.conf'
          assert p['update']['required_repositories'] == ['core', 'extra', 'multilib', 'cachyos']
          assert p['adaptive']['a15_execution_certified'] is True
          assert p['adaptive']['certified_effects'] == ['notifications']
          assert p['adaptive']['service_enabled'] is True
          assert p['system_states']['filesystem'] == 'btrfs'
          assert p['system_states']['home_rollback_policy'] == 'exclude-personal-data-by-default'
          assert p['system_states']['snapshot_retention_authority'] == 'snapper-cleanup-policy'
          assert p['system_states']['recovery_eligibility_authority'] == 'guardian'
          assert p['system_states']['maximum_boot_candidates'] == 10
          assert p['system_states']['retained_snapshot_count_independent_of_boot_candidates'] is True
          fw = p['network']['firewall']
          assert fw['ownership_model'] == 'maho-minimal-host-input'
          assert fw['physical_activation_certified'] is False
          assert fw['owned_table'] == 'inet maho_host'
          assert fw['owned_hooks'] == ['input']
          assert fw['unowned_hooks'] == ['forward', 'output']
          assert fw['default_input_policy'] == 'drop'
          assert p['recovery']['prefer_smallest_effective_scope'] is True
          assert p['recovery']['destructive_actions_require_confirmation'] is True
          PY

      - name: Recovery policy contracts
        shell: bash
        run: |
          set -euo pipefail
          python tests/recovery-policy.py

      - name: Read-only platform doctor contracts
        shell: bash
        run: |
          set -euo pipefail
          bash tests/platform-doctor.sh
          bash tests/platform-hardening-contracts.sh
          bash tests/platform-transaction-contracts.sh
          python tests/reliability-policy-contracts.py
          bash tests/storage-health-contracts.sh
          bash tests/firewall-certification-contracts.sh
          bash tests/firewall-policy-netns.sh
          bash tests/firewall-transaction-netns.sh
          bash tests/memory-certification-contracts.sh

      - name: Read-only recovery generation contracts
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_recovery_generations.py
          python tests/test_recovery_cli.py

      - name: L3 system restore preflight contracts
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_system_restore.py
          python tests/test_system_restore_evidence.py
          python tests/test_system_restore_journal.py
          python tests/test_system_restore_provider.py
          python tests/test_system_restore_transaction.py
          python tests/test_system_restore_preparation.py
          python tests/test_system_restore_host.py
          python tests/test_system_restore_runtime.py
          python tests/test_system_restore_campaign.py
          bash tests/l3-campaign-install.sh

      - name: Adaptive policy A1-A15 contracts
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_adaptive_*.py; do
            python "$test"
          done
          bash tests/adaptive-actuator-contracts.sh

      - name: M4B native update campaign contracts
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_maho_update_native.py
          bash tests/m4b-campaign-install.sh

      - name: Text recovery console consent contracts
        shell: bash
        run: |
          set -euo pipefail
          bash tests/recovery-console.sh

      - name: Recovery overlay contracts
        shell: bash
        run: |
          set -euo pipefail
          bash tests/recovery-overlay.sh

      - name: Platform and recovery syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile lib/maho_firewall_transaction.py lib/maho_memory_certify.py
          bash -n bin/maho-platform bin/maho-platform-install bin/maho-recovery bin/maho-recovery-overlay-install bin/maho-l3-campaign bin/maho-l3-campaign-install bin/maho-update-campaign bin/maho-update-campaign-install bin/maho-adaptive lib/maho-recovery-overlay tests/platform-doctor.sh tests/platform-hardening-contracts.sh tests/platform-transaction-contracts.sh tests/recovery-console.sh tests/recovery-overlay.sh tests/l3-campaign-install.sh tests/m4b-campaign-install.sh tests/adaptive-actuator-contracts.sh adapters/notifications/adaptive-quiet.sh
          python - <<'PY'
          import ast
          import pathlib
          for file in ('lib/maho_platform_install.py', 'lib/maho_recovery_policy.py', 'lib/maho_recovery_generation.py', 'lib/maho_recovery_discovery.py', 'lib/maho_recovery_cli.py', 'lib/maho_system_restore.py', 'lib/maho_system_restore_cli.py', 'lib/maho_system_restore_evidence.py', 'lib/maho_system_restore_journal.py', 'lib/maho_system_restore_provider.py', 'lib/maho_system_restore_transaction.py', 'lib/maho_system_restore_preparation.py', 'lib/maho_system_restore_host.py', 'lib/maho_system_restore_runtime.py', 'lib/maho_system_restore_campaign.py', 'tests/recovery-policy.py', 'tests/test_recovery_generations.py', 'tests/test_recovery_cli.py', 'tests/test_system_restore.py', 'tests/test_system_restore_evidence.py', 'tests/test_system_restore_journal.py', 'tests/test_system_restore_provider.py', 'tests/test_system_restore_transaction.py', 'tests/test_system_restore_preparation.py', 'tests/test_system_restore_host.py', 'tests/test_system_restore_runtime.py', 'tests/test_system_restore_campaign.py'):
              ast.parse(pathlib.Path(file).read_text(), filename=file)
          for file in sorted(pathlib.Path('lib').glob('maho_adaptive_*.py')) + sorted(pathlib.Path('tests').glob('test_adaptive_*.py')):
              ast.parse(file.read_text(), filename=str(file))
          PY
