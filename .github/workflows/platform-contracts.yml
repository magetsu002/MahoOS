name: platform-contracts

on:
  push:
    branches:
      - main
      - integration/v1-cleanup
      - 'integration/**'
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate platform policy schema surface
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool config/platform.json >/dev/null
          python - <<'PY'
          import json
          import pathlib

          p = json.loads(pathlib.Path('config/platform.json').read_text())
          assert p['schema_version'] == 1
          assert p['kernel']['primary_package'] == 'linux-cachyos'
          assert p['kernel']['fallback_package'] == 'linux-cachyos-lts'
          assert p['kernel']['fallback_visibility'] == 'recovery-or-advanced-only'
          assert p['kernel']['custom_kernel_fork'] is False
          assert p['boot']['manager'] == 'limine'
          assert p['boot']['default_kernel'] == 'linux-cachyos'
          assert p['boot']['recovery_kernel'] == 'linux-cachyos-lts'
          assert p['boot']['snapshot_integration'] == 'limine-snapper-sync'
          assert p['boot']['kernel_update_snapshot_restore_certified'] is True
          assert p['boot']['boot_state_transaction_required'] is True
          assert p['system_states']['filesystem'] == 'btrfs'
          assert p['system_states']['home_rollback_policy'] == 'exclude-personal-data-by-default'
          assert p['recovery']['prefer_smallest_effective_scope'] is True
          assert p['recovery']['destructive_actions_require_confirmation'] is True
          PY

      - name: Recovery policy contracts
        shell: bash
        run: |
          set -euo pipefail
          python tests/recovery-policy.py

      - name: Read-only platform doctor contracts
        shell: bash
        run: |
          set -euo pipefail
          bash tests/platform-doctor.sh

      - name: Read-only recovery generation contracts
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_recovery_generations.py
          python tests/test_recovery_cli.py

      - name: L3 system restore preflight contracts
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_system_restore.py
          python tests/test_system_restore_evidence.py
          python tests/test_system_restore_journal.py
          python tests/test_system_restore_provider.py
          python tests/test_system_restore_transaction.py
          python tests/test_system_restore_preparation.py
          python tests/test_system_restore_host.py
          python tests/test_system_restore_runtime.py
          python tests/test_system_restore_campaign.py
          bash tests/l3-campaign-install.sh

      - name: Text recovery console consent contracts
        shell: bash
        run: |
          set -euo pipefail
          bash tests/recovery-console.sh

      - name: Recovery overlay contracts
        shell: bash
        run: |
          set -euo pipefail
          bash tests/recovery-overlay.sh

      - name: Platform and recovery syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n bin/maho-platform bin/maho-recovery bin/maho-recovery-overlay-install bin/maho-l3-campaign bin/maho-l3-campaign-install lib/maho-recovery-overlay tests/platform-doctor.sh tests/recovery-console.sh tests/recovery-overlay.sh tests/l3-campaign-install.sh
          python - <<'PY'
          import ast
          import pathlib
          for file in ('lib/maho_recovery_policy.py', 'lib/maho_recovery_generation.py', 'lib/maho_recovery_discovery.py', 'lib/maho_recovery_cli.py', 'lib/maho_system_restore.py', 'lib/maho_system_restore_cli.py', 'lib/maho_system_restore_evidence.py', 'lib/maho_system_restore_journal.py', 'lib/maho_system_restore_provider.py', 'lib/maho_system_restore_transaction.py', 'lib/maho_system_restore_preparation.py', 'lib/maho_system_restore_host.py', 'lib/maho_system_restore_runtime.py', 'lib/maho_system_restore_campaign.py', 'tests/recovery-policy.py', 'tests/test_recovery_generations.py', 'tests/test_recovery_cli.py', 'tests/test_system_restore.py', 'tests/test_system_restore_evidence.py', 'tests/test_system_restore_journal.py', 'tests/test_system_restore_provider.py', 'tests/test_system_restore_transaction.py', 'tests/test_system_restore_preparation.py', 'tests/test_system_restore_host.py', 'tests/test_system_restore_runtime.py', 'tests/test_system_restore_campaign.py'):
              ast.parse(pathlib.Path(file).read_text(), filename=file)
          PY
