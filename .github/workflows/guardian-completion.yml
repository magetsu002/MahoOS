name: guardian-completion

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  guardian-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Branch diff hygiene
        shell: bash
        run: git diff --check origin/main...HEAD
      - name: Compile completion contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            lib/guardian_containment.py \
            lib/guardian_containment_adapter.py \
            lib/guardian_security_recovery.py \
            tests/test_guardian_containment.py \
            tests/test_guardian_security_recovery.py
      - name: Guardian containment authority contracts
        shell: bash
        run: python tests/test_guardian_containment.py
      - name: Security to recovery routing contracts
        shell: bash
        run: python tests/test_guardian_security_recovery.py
      - name: Existing reversible containment regression
        shell: bash
        run: bash tests/security-containment.sh
      - name: Existing offline recovery regression
        shell: bash
        run: python tests/test_guardian_offline_recovery.py
