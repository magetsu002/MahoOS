name: notify

on:
  push:
    branches:
      - main
    paths:
      - 'bin/maho-notify'
      - 'config/quickshell/maho-notify/**'
      - 'config/quickshell/maho-shell/NotifyStatus.qml'
      - 'tests/notify-contracts.sh'
      - 'tests/glass-contracts.sh'
      - '.github/workflows/notify.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'bin/maho-notify'
      - 'config/quickshell/maho-notify/**'
      - 'config/quickshell/maho-shell/NotifyStatus.qml'
      - 'tests/notify-contracts.sh'
      - 'tests/glass-contracts.sh'
      - '.github/workflows/notify.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n bin/maho-notify tests/notify-contracts.sh tests/glass-contracts.sh

      - name: Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile config/quickshell/maho-notify/state.py

      - name: Notify behavior contracts
        shell: bash
        run: |
          set -euo pipefail
          bash tests/notify-contracts.sh

      - name: Notify glass contracts
        shell: bash
        run: |
          set -euo pipefail
          bash tests/glass-contracts.sh
