name: ux-cleanup

on:
  push:
    branches:
      - 'fix/ux-cleanup-launcher-clipboard'
  pull_request:
    paths:
      - 'bin/maho-launcher'
      - 'bin/maho-clipboard'
      - 'bin/maho-clipboard-history'
      - 'systemd/user/maho-clipboard-history.service'
      - 'lib/maho_launcher_backend.py'
      - 'config/hypr/maho/core/binds.lua'
      - 'config/quickshell/maho-launcher/**'
      - 'config/quickshell/maho-clipboard/**'
      - 'tests/launcher-qml-contracts.sh'
      - 'tests/clipboard-contracts.sh'
      - 'tests/clipboard-bind-contracts.sh'
      - 'tests/clipboard-history-contracts.sh'
      - 'tests/clipboard-runtime-path-contracts.sh'
      - 'tests/tst-clipboard-pin-glyph.qml'
      - 'tests/tst-clipboard-pin-row.qml'
      - 'tests/ux-cleanup-contracts.sh'
      - '.github/workflows/ux-cleanup.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install Arch test dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            diffutils \
            python \
            qt6-base \
            qt6-declarative

      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          set -euo pipefail
          bash -n bin/maho-launcher bin/maho-clipboard bin/maho-clipboard-history \
            tests/launcher-qml-contracts.sh tests/clipboard-contracts.sh \
            tests/clipboard-bind-contracts.sh tests/clipboard-history-contracts.sh \
            tests/clipboard-runtime-path-contracts.sh tests/ux-cleanup-contracts.sh

      - name: Python syntax
        run: |
          set -euo pipefail
          python3 -m py_compile \
            lib/maho_launcher_backend.py \
            config/quickshell/maho-clipboard/clipboard.py

      - name: Clipboard contracts
        run: |
          set -euo pipefail
          bash tests/clipboard-contracts.sh

      - name: Clipboard managed bind contract
        run: |
          set -euo pipefail
          bash tests/clipboard-bind-contracts.sh

      - name: Clipboard immutable runtime path contract
        run: |
          set -euo pipefail
          bash tests/clipboard-runtime-path-contracts.sh

      - name: Clipboard pin glyph render contract
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          QMLTESTRUNNER="$(command -v qmltestrunner || true)"
          if [ -z "$QMLTESTRUNNER" ] && [ -x /usr/lib/qt6/bin/qmltestrunner ]; then
            QMLTESTRUNNER=/usr/lib/qt6/bin/qmltestrunner
          fi
          [ -n "$QMLTESTRUNNER" ] || { echo 'Qt QML test runner is unavailable' >&2; exit 1; }
          "$QMLTESTRUNNER" -input tests/tst-clipboard-pin-glyph.qml
          "$QMLTESTRUNNER" -input tests/tst-clipboard-pin-row.qml

      - name: Clipboard history contracts
        run: |
          set -euo pipefail
          bash tests/clipboard-history-contracts.sh

      - name: Launcher contracts
        run: |
          set -euo pipefail
          bash tests/launcher-qml-contracts.sh

      - name: UX cleanup regression contracts
        run: |
          set -euo pipefail
          bash tests/ux-cleanup-contracts.sh
