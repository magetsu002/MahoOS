name: launcher-qml

on:
  push:
    branches:
      - main
    paths:
      - 'bin/maho-launcher'
      - 'lib/maho_launcher_backend.py'
      - 'config/quickshell/maho-launcher/**'
      - 'tests/launcher-qml-contracts.sh'
      - '.github/workflows/launcher-qml.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'bin/maho-launcher'
      - 'lib/maho_launcher_backend.py'
      - 'config/quickshell/maho-launcher/**'
      - 'tests/launcher-qml-contracts.sh'
      - '.github/workflows/launcher-qml.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    steps:
      - name: Install Arch test dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            diffutils \
            python \
            qt6-base \
            qt6-declarative

      - uses: actions/checkout@v4

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n bin/maho-launcher tests/launcher-qml-contracts.sh

      - name: Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile lib/maho_launcher_backend.py

      - name: Native launcher contracts
        shell: bash
        run: |
          set -euo pipefail
          bash tests/launcher-qml-contracts.sh
