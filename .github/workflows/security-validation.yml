name: security-validation

on:
  push:
    branches:
      - main
    paths:
      - 'bin/maho-security*'
      - 'lib/security_*.py'
      - 'lib/guardian_*.py'
      - 'lib/maho_prevention_*.py'
      - 'lib/maho_mutation_authority.py'
      - 'src/maho_prevention_*'
      - 'bpf/**'
      - 'tests/security-*.sh'
      - 'tests/test_guardian_*.py'
      - 'tests/test_maho_prevention_*.py'
      - 'tests/test_maho_mutation_authority.py'
      - 'tools/security-validation-report.sh'
      - '.github/workflows/security-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'bin/maho-security*'
      - 'lib/security_*.py'
      - 'lib/guardian_*.py'
      - 'lib/maho_prevention_*.py'
      - 'lib/maho_mutation_authority.py'
      - 'src/maho_prevention_*'
      - 'bpf/**'
      - 'tests/security-*.sh'
      - 'tests/test_guardian_*.py'
      - 'tests/test_maho_prevention_*.py'
      - 'tests/test_maho_mutation_authority.py'
      - 'tools/security-validation-report.sh'
      - '.github/workflows/security-validation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-security-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Generate security validation report
        shell: bash
        run: |
          set -euo pipefail
          bash tools/security-validation-report.sh "$GITHUB_WORKSPACE/security-validation"

      - name: Validate evidence schema and revision
        shell: bash
        run: |
          set -euo pipefail
          python - security-validation/report.json "$GITHUB_SHA" <<'PY'
          import json
          import pathlib
          import sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert data['schema_version'] == 1
          assert data['source_revision'] == sys.argv[2]
          assert data['suite_count'] >= 9
          assert data['suites_failed'] == 0
          assert data['suites_passed'] == data['suite_count']
          assert 'not a claim of complete system security' in data['claim_scope']
          PY

      - name: Upload reproducible evidence
        uses: actions/upload-artifact@v4
        with:
          name: maho-security-validation
          path: security-validation/
          retention-days: 7
