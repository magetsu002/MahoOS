name: maho-link

on:
  push:
    branches:
      - main
    paths:
      - 'bin/maho-link'
      - 'config/quickshell/maho-link/**'
      - 'config/quickshell/maho-shell/BluetoothAutoConnect.qml'
      - 'tests/maho-link*.sh'
      - 'tests/maho-link*.py'
      - '.github/workflows/maho-link.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'bin/maho-link'
      - 'config/quickshell/maho-link/**'
      - 'config/quickshell/maho-shell/BluetoothAutoConnect.qml'
      - 'tests/maho-link*.sh'
      - 'tests/maho-link*.py'
      - '.github/workflows/maho-link.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          set -euo pipefail
          bash -n \
            bin/maho-link \
            tests/maho-link-contracts.sh \
            tests/maho-link-drag-startup-contracts.sh \
            tests/maho-link-shared-position-contracts.sh \
            tests/maho-link-bluetooth-session-contracts.sh \
            tests/maho-link-single-hover-contracts.sh \
            tests/maho-link-compositor-contracts.sh

      - name: Python syntax
        run: |
          set -euo pipefail
          python -m py_compile \
            config/quickshell/maho-link/wifi.py \
            config/quickshell/maho-link/bluetooth.py

      - name: Maho Link contracts
        run: |
          set -euo pipefail
          bash tests/maho-link-contracts.sh

      - name: Maho Link drag and startup contracts
        run: |
          set -euo pipefail
          bash tests/maho-link-drag-startup-contracts.sh

      - name: Shared Wi-Fi/Bluetooth placement contracts
        run: |
          set -euo pipefail
          bash tests/maho-link-shared-position-contracts.sh

      - name: Bluetooth discovery-session contracts
        run: |
          set -euo pipefail
          bash tests/maho-link-bluetooth-session-contracts.sh

      - name: Single-hover interaction contracts
        run: |
          set -euo pipefail
          bash tests/maho-link-single-hover-contracts.sh

      - name: Link compositor contracts
        run: |
          set -euo pipefail
          bash tests/maho-link-compositor-contracts.sh
