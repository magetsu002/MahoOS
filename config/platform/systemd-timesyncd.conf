# managed-by: maho-platform v1
[Time]
# Prefer per-link NTP learned from NetworkManager. These are bounded fallbacks
# for networks that publish no time authority.
FallbackNTP=0.arch.pool.ntp.org 1.arch.pool.ntp.org 2.arch.pool.ntp.org 3.arch.pool.ntp.org
ConnectionRetrySec=30s
PollIntervalMinSec=32s
PollIntervalMaxSec=2048s
